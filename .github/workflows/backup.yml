name: Backup Supabase to Google Drive (Structured)

on:
  schedule:
    # Berjalan Senin-Jumat jam 10:00 UTC (18:00 WITA)
    - cron: '0 10 * * 1-5' 
  workflow_dispatch: {} # Tombol untuk menjalankan manual
  repository_dispatch:  # Untuk dipicu dari tombol aplikasi Monica
    types: [backup_trigger] 

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. INSTALL LIBRARY CANVAS
      - name: Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # 2. INSTALL GOOGLE CHROME (Fix untuk Ubuntu 24.04)
      - name: Install Google Chrome (Stable)
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          sudo rm -f /usr/share/keyrings/google-chrome.gpg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 3. INSTALL DEPENDENCIES (Node.js)
      - name: Install Dependencies
        env:
          # Mencegah Puppeteer mengunduh Chrome yang bikin timeout
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      # 4. INSTALL RCLONE
      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      # 5. RUN BACKUP SCRIPT
      - name: Run Backup Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Arahkan ke Google Chrome yang baru diinstall
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: node scripts/backup.js