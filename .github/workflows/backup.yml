name: Backup Supabase to Google Drive (Structured)

on:
  schedule:
    # Berjalan Senin-Jumat jam 10:00 UTC (17:00 WIB)
    - cron: '0 10 * * 1-5' 
  workflow_dispatch: {} # Tombol untuk menjalankan manual
  repository_dispatch:  # Untuk dipicu dari tombol aplikasi Monica
    types: [backup_trigger] 

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TAMBAHKAN LANGKAH INI UNTUK MENGINSTALL LIBRARY CANVAS
      - name: Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # UBAH BAGIAN INI: Gunakan npm install (untuk membaca package.json)
      - name: Install Dependencies
        run: npm install

      # TAMBAHKAN LANGKAH INI UNTUK MENGINSTALL CHROMIUM (untuk Puppeteer)
      - name: Install Chromium for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Run Backup Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: node scripts/backup.js