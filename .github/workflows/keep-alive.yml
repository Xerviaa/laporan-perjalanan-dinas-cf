name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap hari pada jam 00:00 UTC (sekitar jam 08:00 WITA)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan kamu menjalankannya manual untuk tes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          # Memanggil fungsi ping_keepalive() di Supabase
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping_keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'